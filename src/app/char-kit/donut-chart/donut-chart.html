<svg [attr.viewBox]="'0 0 '+size()+' '+size()">
    <circle class="background"
        [attr.cx]="size()/2"
        [attr.cy]="size()/2"
        [attr.r]="radius()" />
        @for (arc of renderArcs(); track arc.label) {
            <path #arc class="arc" 
                [attr.d]="buildPath(arc.startAngle,arc.endAngle)" 
                [style.stroke]="colors()[$index%colors().length]" />
        }
        <text class="total" x="50%" y="50%">{{total()}}</text>
        <text class="subtitle" x="50%" y="62%">total</text>
</svg>
<div class="legend">
    @for (arc of renderArcs(); track arc.label) {
        <div class="legend-item">
            <span class="dot" [style.background]="colors()[$index%colors().length]"></span>
            <span>{{arc.label}}</span>
            <strong>{{arc.value}}</strong>
        </div>
    }
</div>
