<svg class="chart" [attr.viewBox]="'0 0 '+width()+' '+height()">
    <defs>
        <linearGradient [attr.id]="gradientId" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" [attr.stop-color]="colors()[0]"stop-opacity=".35"/>
            <stop offset="100%" [attr.stop-color]="colors()[0]" stop-opacity="0" />
        </linearGradient>
    </defs>
    <polygon class="area" [attr.points]="area()" [attr.fill]="'url(#'+gradientId+')'" />
    <polyline class="line" fill="none" [attr.points]="polyline()" [attr.stroke]="colors()[0]" />
</svg>
