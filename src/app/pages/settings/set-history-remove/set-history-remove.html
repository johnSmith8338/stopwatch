<div class="button-group">
    <button [class.active]="settings.historyRetentionDays()===-1" (click)="settings.setHistoryRetentionDays(-1)">never</button>
    <button [class.active]="settings.historyRetentionDays()===1" (click)="settings.setHistoryRetentionDays(1)">1 day</button>
    <button [class.active]="settings.historyRetentionDays()===7" (click)="settings.setHistoryRetentionDays(7)">7 days</button>
    <button [class.active]="settings.historyRetentionDays()===30" (click)="settings.setHistoryRetentionDays(30)">30 days</button>
    <button [class.active]="settings.historyRetentionDays()===90" (click)="settings.setHistoryRetentionDays(90)">90 days</button>
</div>
