<h3>theme</h3>
<app-toggle [checked]="themeSvc.theme()==='dark'" (checkedChange)="changeTheme()">
    <span left>light</span>
    <span right>dark</span>
</app-toggle>

<h3>default timer settings</h3>
<app-default-timer-settings />

<h3>wake lock</h3>
<app-toggle [checked]="settings.keepScreenAwake()" (checkedChange)="toggleWakeLock($event)">
    <span left>sleep</span>
    <span right>wake lock</span>
</app-toggle>

<h3>alarm sorting</h3>
<div class="button-group">
    <button [class.active]="settings.alarmSortMode()==='manual'" (click)="settings.setAlarmSortMode('manual')">manual</button>
    <button [class.active]="settings.alarmSortMode()==='time'" (click)="settings.setAlarmSortMode('time')">time</button>
</div>

<h3>clear history</h3>
<div class="button-group">
    <button [class.active]="settings.historyRetentionDays()===-1" (click)="settings.setHistoryRetentionDays(-1)">never</button>
    <button [class.active]="settings.historyRetentionDays()===1" (click)="settings.setHistoryRetentionDays(1)">1 day</button>
    <button [class.active]="settings.historyRetentionDays()===7" (click)="settings.setHistoryRetentionDays(7)">7 days</button>
    <button [class.active]="settings.historyRetentionDays()===30" (click)="settings.setHistoryRetentionDays(30)">30 days</button>
    <button [class.active]="settings.historyRetentionDays()===90" (click)="settings.setHistoryRetentionDays(90)">90 days</button>
</div>

<h3>backup</h3>
<button (click)="exportBackup()">export json</button>
<input #file hidden type="file" accept=".json" (change)="importBackup($event)">
<button (click)="file.click()">import json</button>
