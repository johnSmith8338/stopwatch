<h3>theme</h3>
<app-toggle [checked]="themeSvc.theme()==='dark'" (checkedChange)="changeTheme()">
    <span left>light</span>
    <span right>dark</span>
</app-toggle>

<h3>default timer settings</h3>
<app-default-timer-settings />

<h3>clear history</h3>
<select [value]="settings.historyRetentionDays()" (change)="changeHistory($event)">
    <option value="-1">never</option>
    <option value="1">1 day</option>
    <option value="7">7 days</option>
    <option value="30">30 days</option>
    <option value="90">90 days</option>
</select>

<h3>backup</h3>
<button (click)="exportBackup()">export json</button>
<input #file hidden type="file" accept=".json" (change)="importBackup($event)">
<button (click)="file.click()">import json</button>
